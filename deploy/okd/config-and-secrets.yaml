apiVersion: v1
kind: ConfigMap
metadata:
  name: openeco-config
data:
  NEXTAUTH_URL: "https://openeco.example.com"
  NEXT_PUBLIC_APP_URL: "https://openeco.example.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: openeco-secrets
type: Opaque
stringData:
  # IMPORTANT: Replace ALL values below before deploying to any environment.
  # The defaults shown here are insecure placeholders only.
  #
  # Generate a strong NEXTAUTH_SECRET with:
  #   openssl rand -base64 32
  #
  # Use a dedicated database user with a strong password instead of 'postgres'.
  DATABASE_URL: "postgresql://openeco:<REPLACE_WITH_STRONG_PASSWORD>@postgres:5432/openeco?schema=public"
  NEXTAUTH_SECRET: "<REPLACE_WITH_OUTPUT_OF: openssl rand -base64 32>"

