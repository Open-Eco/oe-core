apiVersion: v1
kind: ConfigMap
metadata:
  name: openeco-config
data:
  NEXTAUTH_URL: "https://openeco.example.com"
  NEXT_PUBLIC_APP_URL: "https://openeco.example.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: openeco-secrets
type: Opaque
stringData:
  # Example values; enterprises should override these
  DATABASE_URL: "postgresql://postgres:password@postgres:5432/openeco?schema=public"
  NEXTAUTH_SECRET: "replace-with-strong-random-secret"


