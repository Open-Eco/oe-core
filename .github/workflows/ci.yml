name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/ci.yml'

# Limit the default token permissions for all jobs in this workflow.
permissions:
  contents: read

# Placeholder env vars used at build/CI time only — never real credentials.
env:
  DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
  NEXTAUTH_SECRET: "ci-placeholder-secret-do-not-use-in-production"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

  container-build:
    name: Container Build
    runs-on: ubuntu-latest
    needs: build
    # Only run on pushes to main to avoid unnecessary builds on every PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Containerfile
          push: false
          tags: ghcr.io/open-eco/oe-core:web-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
